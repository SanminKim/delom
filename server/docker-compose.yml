# Запуск «Делом» на сервере: база данных, серверная часть, фоновые задачи и веб-сервер с HTTPS.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delom
      POSTGRES_USER: delom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delom"]
      interval: 5s
      retries: 10

  web: &app
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в .env}
      DATABASE_URL: postgres://delom:${POSTGRES_PASSWORD}@db:5432/delom
      ALLOWED_HOSTS: ${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media

  # Раз в час закрывает позиции, где компания не ответила на отклик за 7 дней
  worker:
    <<: *app
    command: sh -c "while true; do python manage.py close_overdue; sleep 3600; done"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../index.html:/srv/site/index.html:ro
      - caddy:/data

volumes:
  db:
  media:
  caddy:
