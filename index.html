function aiReply(q){
 const t=q.toLowerCase(),tr=T(),r=readiness(),d=mainDone(tr.id),mp=P(tr.main),inv=S.inv[tr.main];
 if(/стажир|что .*нужно|получить|шанс/.test(t))return d?{html:`Сейчас ваш профиль соответствует стажировкам ${tr.goal} примерно на <b>${r}%</b> — после проекта ${mp.company} вы прошли порог 75%.<br><br>Чтобы дойти до уровня Junior:<ol><li>Подтвердить A/B-тестирование — проект Ozon.</li><li>${tr.id==='pm'?'Разобраться с юнит-экономикой.':'Подтвердить статистику тестом.'}</li><li>${inv&&inv.st==='accepted'?`Хорошо пройти интервью в ${mp.company}.`:`Ответить на приглашение ${mp.company}.`}</li></ol>Уже сейчас вам доступно ${fitCount()} подходящих стажировок.`,acts:[['Проект Ozon','go:project-p6'],['Стажировки','go:internships']]}
  :{html:`Сейчас ваш профиль соответствует стажировкам ${tr.goal} примерно на <b>${r}%</b>.<br><br>Рекомендую:<ol><li>Подтвердить навык SQL.</li><li>Выполнить ещё один реальный ${tr.id==='pm'?'продуктовый':'аналитический'} проект.</li><li>Добавить ${tr.id==='pm'?'продуктовые метрики':'дашборд с метриками'} в портфолио.</li></ol>После этого вам будут доступны ещё около 12 подходящих стажировок.`,acts:[['Найти проект','go:projects-sql'],['Посмотреть карьерный путь','go:career']]};
 if(/sql/.test(t))return sk('sql').st==='ok'?{html:`SQL у вас уже подтверждён: ${esc(sk('sql').basis)}. Следующий уровень — оконные функции и когортный анализ: пригодятся в проекте Т-Банка по удержанию.`,acts:[['Проект Т-Банка','go:project-p4']]}:{html:`Сейчас SQL у вас на 70%. Есть два пути:<ol><li><b>Быстро:</b> тест из 5 вопросов, около 7 минут.</li><li><b>Сильнее всего:</b> проект ${mp.company} — вместе с SQL подтвердятся ещё ${confirmsOf(tr.main).length-1} навыка.</li></ol>`,acts:[['Пройти тест','act:test:sql'],['Проект '+mp.company,'go:project-'+tr.main]]};
 if(/интервью|собесед/.test(t))return {html:`${inv?`Интервью в ${mp.company} проведёт ${empOfProj(tr.main).person}. `:''}Как подготовиться:<ol><li>Расскажите кейс по схеме: проблема → данные → вывод → гипотеза → метрика.</li><li>Подготовьте ответ на вопрос «Как бы вы приоритизировали гипотезы?» — используйте RICE.</li><li>Изучите продукт компании: пройдите путь пользователя до оплаты.</li></ol>Могу провести тренировочное интервью — напишите «давай потренируемся».`};
 if(/потрен/.test(t))return {html:`Первый вопрос: <b>«${tr.id==='pm'?'Конверсия в оплату упала на 10%. Ваши первые три действия?':'Retention упал на 5 п.п. Как будете искать причину?'}»</b> Напишите ответ — я дам обратную связь.`};
 if(/проект|подход/.test(t))return {html:`Под цель ${tr.goal} лучше всего подходят: «${mp.title}» от ${mp.company} (подтвердит ${confirmsOf(tr.main).length} навыков), «A/B-тест карточки товара» от Ozon и командный «Онбординг продавцов» от Avito.`,acts:[['Каталог проектов','go:projects'],['Проект '+mp.company,'go:project-'+tr.main]]};
 if(/презентац|структур/.test(t))return {html:'Структура на 10 слайдов: 1) главный вывод, 2) контекст и данные, 3–5) анализ и проблемные места, 6–8) гипотезы с RICE, 9) что проверить первым, 10) ожидаемый эффект. Выводы пишите в заголовках слайдов.'};
 if(/вакан|ozon|vk|яндекс|банк|avito|kaspersky|skillup/.test(t))return {html:'Совпадение считается по подтверждённым навыкам. Для этой позиции проверьте блок «Нужно улучшить»: один подтверждённый навык обычно даёт +3–8% совпадения. Перед откликом добавьте в портфолио проект с метриками.',acts:[['Мои навыки','go:skills']]};
 if(/конверси|retention|причин|действи/.test(t))return {html:'Хороший ход мысли. Сильный ответ на интервью: 1) проверить, не сломался ли сбор данных, 2) разложить метрику по шагам и сегментам, 3) сопоставить с релизами и внешними событиями. Главное — сначала диагноз, потом решение.'};
 return {html:`Понял вопрос. Пока я лучше всего помогаю с планом развития, подбором проектов и стажировок и подготовкой к интервью. Ваша текущая готовность — ${r}%.`,acts:[['Мой путь','go:career']]};
}

document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-act],[data-go]');
 if(!ev.target.closest('.pop')&&!ev.target.closest('[data-act="notif"],[data-act="me"],[data-act="tour"],[data-act="roles"]')&&!ev.target.closest('.search'))closePop();
 if(!t)return;
 if(t.dataset.go){ev.preventDefault();closeModal();const g=t.dataset.go;
  if(g==='onb'){closePop();UI.onb={step:'goal',goal:S.goal};renderOnb();return}
  if(g.startsWith('auth')&&parse().n!=='auth')UI.login=!!t.dataset.login;
  const i=g.indexOf('-');i<0?go(g):go(g.slice(0,i),g.slice(i+1));return}
 const f=A[t.dataset.act];if(f){if(t.dataset.act!=='closeModalScrim')ev.stopPropagation();f(t,ev)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modalRoot').innerHTML&&S.onboarded)closeModal();else if(UI.ai)A.aiClose();closePop()}
 if(e.key==='Enter'&&e.target.id==='gsearch'){const b=$('#searchPop .pop-item');if(b)b.click()}});
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(id==='ws-sum'){const pid=e.target.dataset.id,w=wsOf(pid);w.summary=e.target.value;save();const c=$('#sumCount');if(c)c.textContent=`${w.summary.trim().length} / ${SUM_MIN}+ знаков`;const b=$('#wsSubmit');if(b)b.disabled=!wsReady(w);const h=$('#wsHint');if(h)h.textContent=wsHint(w);return}
 if(id==='gsearch')return doSearch(e.target.value);
 if(id==='pf-q'){UI.proj.q=e.target.value;renderProjList()}
 if(id==='uf-q'){UI.uni.q=e.target.value;renderUniList()}
 if(id==='cf-min'){UI.cand.min=+e.target.value;$('#cf-minv').textContent=UI.cand.min+'%';renderCandList()}
 if(id.startsWith('calc-')){const k=id.slice(5);UI.calc[k]=+e.target.value;const v=$('#'+id+'-v');if(v)v.textContent=k==='cost'?rub(UI.calc[k]):k==='fail'?UI.calc[k]+'%':UI.calc[k];$('#calcOut').innerHTML=calcOut()}
 if(id==='cf-ans'){UI.cfAns=e.target.value;const c=$('#cf-count');if(c)c.textContent=e.target.value.split(/\s+/).filter(Boolean).length+' слов'}
 if(id==='rv-comment'){const pid=parse().id;if(UI.rv[pid])UI.rv[pid].comment=e.target.value}
});
document.addEventListener('change',e=>{
 const id=e.target.id,v=e.target.type==='checkbox'?e.target.checked:e.target.value;
 if(id.startsWith('pf-')){UI.proj[id.slice(3)]=v;renderProjList()}
 if(id.startsWith('jf-')){UI.jobs[id.slice(3)]=v;renderJobList()}
 if(id==='cf-prof'){UI.cand.prof=v;renderCandList()}
 if(id==='uf-prog'){UI.uni.prog=v;renderUniList()}
 if(e.target.dataset.sk){const pid=parse().id;const rv=UI.rv[pid];if(rv)rv.sel=$$('[data-sk]').filter(x=>x.checked).map(x=>x.dataset.sk)}
 if(['pr-vis','pr-inv','pr-uni-share'].includes(id)){S.vis={show:$('#pr-vis').checked,inv:$('#pr-inv').checked&&$('#pr-vis').checked,uni:$('#pr-uni-share').checked};save();render();toast(id==='pr-vis'?(S.vis.show?'Профиль снова виден работодателям':'Профиль скрыт от работодателей'):'Настройки видимости сохранены','eye');return}
 if(id==='upl'&&e.target.files[0]){const f=e.target.files[0],pid=e.target.dataset.id;if(f.size>50*1048576){toast('Файл больше 50 МБ — сожмите его или загрузите ссылкой в итоге решения','x');return}storeUpload('ws-'+pid,f).then(rec=>{Object.assign(wsOf(pid),{file:f.name,fileSize:f.size,fileDemo:false});save();render();toast('Файл загружен: '+f.name,'upload')})}
 if(id==='resumeFile'&&e.target.files[0]){const f=e.target.files[0];if(f.size>10*1048576){toast('Файл больше 10 МБ','x');return}Object.assign(UI.onb,{file:f.name,fileObj:f,err:null,step:'parsing'});renderOnb()}
 if(id==='onb-add'&&e.target.value){UI.onb.sel=[...(UI.onb.sel||[]),e.target.value];renderOnb()}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const id=e.target.id;
 if(id==='aiForm'){const i=$('#aiInput');if(i.value.trim())aiSend(i.value.trim());return}
 if(id==='chatForm'){const inp=$('#chat-in'),txt=inp.value.trim();if(!txt)return;const th=S.chats[$('#chat-id').value],side=$('#chat-side').value;
  th.msgs.push({f:side==='student'?'me':'them',t:txt,tm:tnow()});if(side==='employer')th.unreadS=(th.unreadS||0)+1;else th.unreadE=(th.unreadE||0)+1;save();render();
  if(side==='student'&&chatReply(th,txt)!==null){UI.typing[th.id]=1;render();setTimeout(()=>{UI.typing[th.id]=0;const who=th.kind==='team'?S.teams[th.pid].members[0][0]:null;th.msgs.push({f:'them',who,t:chatReply(th,txt),tm:tnow()});save();if(parse().n==='messages'&&parse().id===th.id)render();else{th.unreadS=(th.unreadS||0)+1;save();renderShell(parse())}},1100)}
  else if(side==='employer'){setTimeout(()=>{th.msgs.push({f:'me',t:th.kind==='cand'?'Спасибо, договорились! Жду ссылку на встречу.':'Спасибо! Всё понял, буду готов.',tm:tnow()});th.unreadE=0;save();if(parse().n==='empmessages')render()},1400)}
  return}
 if(id==='authForm'){const role=e.target.dataset.role;const ag=$('#au-agree');if(ag&&!ag.checked){$('#au-err').hidden=false;return}
  const b=$('#au-submit');b.disabled=true;b.innerHTML='<span class="spin" style="border-top-color:#fff"></span>'+(UI.login?'Входим…':'Создаём аккаунт…');
  setTimeout(()=>{S.authed=true;S.lastRole=role;save();toast(UI.login?'С возвращением!':'Аккаунт создан','check');go(HOME[role])},800);return}
 if(id==='profileForm'){const f=e.target;if(!f.reportValidity())return;const g=$('#pr-goal').value;const ch=g!==S.goal;S.goal=g;S.profile={city:$('#pr-city').value.trim(),prog:$('#pr-prog').value.trim(),about:$('#pr-about').value.trim(),tg:$('#pr-tg').value.trim(),format:$('#pr-format').value,start:$('#pr-start').value};save();render();toast(ch?`Профиль сохранён · цель: ${T().goal}`:'Профиль сохранён');return}
 if(id==='salesForm'){if(!e.target.reportValidity())return;S.salesReq=[...(S.salesReq||[]),{n:(S.salesReq||[]).length+101,name:$('#sf-name').value.trim(),contact:$('#sf-contact').value.trim(),hires:+$('#sf-hires').value,ats:$('#sf-ats').value,comment:$('#sf-comment').value.trim(),date:todayStr()}];save();closeModal();render();toast('Запрос на корпоративный тариф сохранён','send');return}
 if(id==='uniForm'){if(!e.target.reportValidity())return;S.uniCourses=[...(S.uniCourses||[]),{course:$('#uf-course').value,pid:$('#uf-proj').value,students:+$('#uf-n').value,date:todayStr()}];save();closeModal();render();toast('Проект встроен в курс — студенты увидят его в каталоге','check');return}
 if(id==='inviteForm'){const c=$('#inv-id').value,pos=$('#inv-pos').value,msg=$('#inv-msg').value.trim();if(msg.length<10){toast('Напишите сообщение кандидату','x');return}
  if(c==='c2'){const e=emp();if(!VIS().inv){toast('Кандидат закрыл приглашения в настройках профиля','lock');closeModal();return}S.inv[e.main]=S.inv[e.main]||{st:'new',direct:1};ensureInviteChat(e.main,msg);save();closeModal();go('empmessages','inv-'+e.main);toast('Приглашение отправлено Алексею Иванову','send');return}
  const e=emp(),k=CANDS.find(x=>x.id===c),cid='cand-'+e.id+'-'+c;S.empInvited[e.id+c]={pos,date:todayStr()};
  S.chats[cid]={id:cid,kind:'cand',co:e.company,cand:c,title:k.name,sub:pos,unreadS:0,unreadE:0,msgs:[{f:'them',t:msg,tm:tnow()},{f:'sys',t:`Приглашение на позицию «${pos}» отправлено`}]};
  save();closeModal();go('empmessages',cid);toast('Приглашение отправлено '+k.name,'send');
  setTimeout(()=>{const th=S.chats[cid];if(!th)return;th.msgs.push({f:'me',t:`Здравствуйте! Спасибо за приглашение на позицию «${pos}». С удовольствием пообщаюсь — удобно в любой будний день после 16:00.`,tm:tnow()});th.unreadE=(th.unreadE||0)+1;save();if(parse().n==='empmessages')render();else renderShell(parse())},1600);return}
 if(id==='vacForm'){const v={type:$('#v-type').value,title:$('#v-title').value.trim()||'Новая позиция',prof:$('#v-prof').value,format:$('#v-format').value,city:$('#v-city').value,salary:$('#v-sal').value?$('#v-sal').value+(/₽/.test($('#v-sal').value)?'':' ₽'):'',paid:$('#v-paid').checked,skills:$('#v-skills').value.split(',').map(s=>s.trim()).filter(Boolean)};S.extraVac.push(v);save();closeModal();render();toast(`${v.type} «${v.title}» опубликована · подобрано 14 кандидатов`,'briefcase');return}
 if(id==='projForm'){const t=$('#pp-title').value.trim(),d=$('#pp-desc').value.trim();if(!t||!d){$('#pp-err').hidden=false;return}
  const fmtv=$('[data-act="ppFormat"].on')?.dataset.id||'Индивидуальный';
  const dir=$('#pp-dir').value;S.published.unshift({pid:'n'+Date.now().toString(36),company:emp().company,ind:emp().ind,emp:emp().id,title:t,task:d,about:`${emp().company}: ${emp().ind}.`,dir,prof:({'Product / Analytics':'Product Manager','Data Analytics':'Data Analyst','Business Analysis':'Business Analyst','Design':'UX/UI Designer','Marketing':'Marketing Manager','Development':'Frontend Developer'})[dir]||'Product Manager',skills:$('#pp-skills').value.split(',').map(s=>s.trim()).filter(Boolean),diff:$('#pp-diff').value,dur:$('#pp-dur').value,format:fmtv,hiring:$('#pp-hire').checked?1:0,deadline:'25 октября'});
  save();go('empjobs');toast('Проект опубликован и появился в каталоге студентов','send')}
});

 while(turns.length&&turns[0].role!=='user')turns.shift();

 SAMPLE([{role:'user',content:AI_RULES()},...turns],{cache:false,onText:({text})=>{bot.html=md(text);const el=$$('#aiBody .msg.bot');const last=el[el.length-1];if(last){last.innerHTML=bot.html;const b=$('#aiBody');b.scrollTop=b.scrollHeight}}})
  .then(r=>{bot.raw=r.text;bot.html=md(r.text);bot.acts=SECTION_LINKS.filter(([n])=>r.text.includes(n)).slice(0,3).map(([n,g])=>['Открыть «'+n+'»',g]);renderAI()})
  .catch(e=>{const c=e&&e.code;if(AI_PERM.includes(c)){SAMPLE=null;const rep=aiReply(q);bot.html=rep.html;bot.acts=rep.acts}else if(c==='cancelled'){bot.html='<span class="muted">Остановлено</span>'}else{bot.html=(e&&e.text?md(e.text)+'<br>':'')+`<span class="muted">${AI_MSG[c]||AI_MSG.upstream_error}</span>`}renderAI()})}

/* ================= mobile layer: tab bar, compact top bar, sheets ================= */
const MQ_M=matchMedia('(max-width:720px)');
const isM=()=>MQ_M.matches;
const TABS={
 student:[['dashboard','home','Главная'],['projects','folder','Проекты'],['internships','cap','Работа'],['messages','mail','Чаты'],['@more','grid','Ещё']],
 employer:[['empdash','grid','Обзор'],['candidates','users','Кандидаты'],['empjobs','briefcase','Вакансии'],['empmessages','msg','Чаты'],['@more','menu','Ещё']],
 mentor:[['mentor','shield','Решения'],['@review','test','Проверка'],['@more','menu','Ещё']],
 uni:[['uni','grid','Обзор'],['unistudents','users','Студенты'],['@more','menu','Ещё']]};
const M_TITLES={dashboard:'Главная',career:'Мой путь',skills:'Навыки',projects:'Проекты',project:'Проект',workspace:'Мой проект',complete:'Результат',internships:'Стажировки',vacancies:'Вакансии',jobs:'Вакансии',job:'Вакансия',portfolio:'Портфолио',profile:'Профиль',try:'Профессии',messages:'Сообщения',resume:'Резюме',interview:'Интервью',applications:'Отклики',empdash:'Обзор',candidates:'Кандидаты',empjobs:'Вакансии',postproject:'Новый проект',pricing:'Тарифы',empmessages:'Сообщения',mentor:'Решения',review:'Проверка',uni:'Обзор',unistudents:'Студенты',metrics:'Метрики'};
const tabKey=(k,role)=>k==='@review'?'review-'+T().main:k;
function tabActive(k,r){const n=curNavKey(r);if(k==='@more')return !TABS[curRole].some(t=>t[0]!=='@more'&&tabActive(t[0],r));
 if(k==='@review')return r.n==='review';if(k==='internships')return ['internships','vacancies','jobs'].includes(n);return n===k}
function tabBadge(k){if(k==='messages'){const n=unreadS();return n?String(n):''}if(k==='empmessages'){const n=unreadE();return n?String(n):''}if(k==='internships'&&mainDone(S.goal))return '5';if(k==='@more'&&curRole==='student'){const n=appsList().filter(a=>a.st==='sent'&&a.d>=7).length;return n?'•':''}return ''}
function renderTabbar(r){let tb=$('#tabbar');if(!tb){tb=document.createElement('nav');tb.id='tabbar';tb.className='tabbar';tb.setAttribute('aria-label','Навигация');document.body.appendChild(tb)}
 tb.innerHTML=TABS[curRole].map(([k,i,l])=>{const on=tabActive(k,r),b=tabBadge(k);return `<button class="tb-i ${on?'on':''}" ${k==='@more'?'data-act="mMore"':`data-go="${tabKey(k)}"`} aria-label="${l}" ${on?'aria-current="page"':''}><span class="tb-ic">${ic(i,22)}${b?`<span class="tb-b ${b==='•'?'dot':''}">${b==='•'?'':b}</span>`:''}</span><span class="tb-l">${l}</span></button>`}).join('')}
const _renderShell=renderShell;
renderShell=function(r){_renderShell(r);renderTabbar(r);
 const tb=$('#topbar');const title=M_TITLES[r.n]||BRAND;
 tb.insertAdjacentHTML('afterbegin',`<div class="m-lead"><button class="icon-btn m-back" data-act="mBack" aria-label="Назад" hidden>${ic('arL')}</button><span class="m-logo" data-go="${HOME[curRole]}">${LOGO}</span><span class="m-title">${esc(title)}</span></div>`);
 const s=$('.top-right',tb);if(s)s.insertAdjacentHTML('afterbegin',`<button class="icon-btn m-search" data-act="mSearch" aria-label="Поиск">${ic('search')}</button>`);
 const sr=$('.search',tb);if(sr)sr.insertAdjacentHTML('beforeend',`<button class="m-cancel linkish" data-act="mSearchX">Отмена</button>`);
 document.body.classList.toggle('has-tabbar',true)};
function mAfter(){
 const bare=$('.app').classList.contains('bare');document.body.classList.toggle('has-tabbar',!bare);const tb=$('#tabbar');if(tb)tb.hidden=bare;
 // back button mirrors the in-page crumb on detail screens
 const cr=$('#view .crumb'),back=$('.m-back');if(back){back.hidden=!cr;if(cr)back.dataset.target=cr.dataset.go||'';$('.m-logo')&&($('.m-logo').hidden=!!cr)}
 // keep the active tab of any tab strip in view
 $$('#view .tabs, #view .seg').forEach(t=>{const on=$('.on',t);if(on&&t.scrollWidth>t.clientWidth)t.scrollLeft=on.offsetLeft-(t.clientWidth-on.offsetWidth)/2});
 // detail screens: primary action pinned above the tab bar
 const old=$('#mCta');if(old)old.remove();document.body.classList.remove('has-cta');
 const n=parse().n;if(!bare&&['project','job','workspace'].includes(n)){const b=$('#view aside .btn-lg');if(b){const w=document.createElement('div');w.id='mCta';w.className='m-cta';w.appendChild(b.cloneNode(true));w.firstChild.removeAttribute('id');document.body.appendChild(w);document.body.classList.add('has-cta')}}}
const _afterRender=afterRender;
afterRender=function(){_afterRender();mAfter()};
MQ_M.addEventListener&&MQ_M.addEventListener('change',()=>{if(!BARE.includes(parse().n))render()});

/* sheets: reuse the open sheet so step-by-step modals don't re-animate */
const _openModal=openModal;
const GRAB='<span class="grab" aria-hidden="true"></span>';
openModal=function(html,cls=''){const m=$('#modalRoot .modal');if(m){m.className='modal '+cls;m.innerHTML=(isM()?GRAB:'')+html;m.scrollTop=0;return}_openModal(html,cls);const nm=$('#modalRoot .modal');if(nm&&isM())nm.insertAdjacentHTML('afterbegin',GRAB)};
function closeSheetAnimated(){const m=$('#modalRoot .modal'),s=$('#modalRoot .scrim');if(!m||!isM()||RM3()){closeModal();return}m.style.transition='transform .22s ease-in';m.style.transform='translateY(100%)';s.style.transition='background .22s';s.style.background='transparent';setTimeout(closeModal,210)}
/* swipe down to close a sheet */
(()=>{let y0=null,m=null,dy=0;
 document.addEventListener('touchstart',e=>{const mm=e.target.closest&&e.target.closest('#modalRoot .modal');if(!mm||!isM()||!S.onboarded&&mm.classList.contains('onb'))return;if(mm.scrollTop>0&&!e.target.closest('.grab,.modal-h'))return;m=mm;y0=e.touches[0].clientY;dy=0;m.style.transition='none'},{passive:true});
 document.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);m.style.transform=`translateY(${dy}px)`},{passive:true});
 document.addEventListener('touchend',()=>{if(y0===null)return;y0=null;if(dy>110){closeSheetAnimated()}else{m.style.transition='transform .2s';m.style.transform=''}m=null})})();

Object.assign(A,{
 mBack(e){const t=e.dataset.target;if(t){const i=t.indexOf('-');i<0?go(t):go(t.slice(0,i),t.slice(i+1))}else history.back()},
 mSearch(){const tb=$('#topbar');tb.classList.add('searching');const i=$('#gsearch');if(i)setTimeout(()=>i.focus(),30)},
 mSearchX(){const tb=$('#topbar');tb.classList.remove('searching');const i=$('#gsearch');if(i)i.value='';doSearch('')},
 mMore(){const r=parse(),role=curRole,cur=curNavKey(r);const inTabs=TABS[role].map(t=>t[0]);
  const groups=navFor(role,r).map(g=>({l:g.l,i:g.i.filter(x=>!inTabs.includes(x[0])).map(x=>x[0]==='review'?[`review-${T().main}`,x[1],x[2],x[3]]:x)})).filter(g=>g.i.length);
  const who={student:['Алексей Иванов','НИУ ВШЭ · цель '+T().goal],employer:[emp().person,emp().company],mentor:[mentorMe().name,mentorMe().pos],uni:[UNI.person,'НИУ ВШЭ · '+UNI.unit]}[role];
  openModal(`<div class="modal-h"><div class="row g12" style="flex-wrap:nowrap">${role==='student'?`<span class="lvl" style="width:44px;height:44px;font-size:18px">${level().n}</span>`:''}<div><h2>${esc(who[0])}</h2><p class="sm muted">${esc(who[1])}</p></div></div><button class="x" data-act="closeModal" aria-label="Закрыть">${ic('x',16)}</button></div>
  <div class="modal-b col g16">${role==='student'?`<div class="mini" data-go="career"><div class="row between"><span class="label">Готовность · ${T().goal}</span><b>${readiness()}%</b></div><div style="margin-top:10px">${bar(readiness(),'o thin')}</div></div>`:''}
  ${groups.map(g=>`<div><div class="label" style="margin-bottom:8px">${g.l}</div><div class="m-grid">${g.i.map(([k,i,l,c])=>`<button class="m-tile ${cur===k.split('-')[0]?'on':''}" data-go="${k}"><span class="m-ti">${ic(i,20)}${c?`<span class="tb-b">${c}</span>`:''}</span><span>${l}</span></button>`).join('')}</div></div>`).join('')}
  ${role==='employer'?`<div class="m-grid"><button class="m-tile" data-act="newVac" data-type="Стажировка"><span class="m-ti">${ic('cap',20)}</span><span>Новая стажировка</span></button><button class="m-tile" data-act="newVac" data-type="Вакансия"><span class="m-ti">${ic('briefcase',20)}</span><span>Новая вакансия</span></button></div>`:''}
  <div><div class="label" style="margin-bottom:8px">Режим просмотра</div><div class="m-roles">${Object.entries(ROLES).map(([k,[l,i]])=>`<button class="m-role ${role===k?'on':''}" data-act="role" data-role="${k}">${ic(i,18)}<span>${l}</span></button>`).join('')}</div></div>
  <div class="m-list"><button data-act="mTour">${ic('flag')}<span>Сценарий демо</span>${ic('arR',16)}</button><button data-go="metrics">${ic('trend')}<span>Метрики платформы</span>${ic('arR',16)}</button><button data-go="welcome">${ic('home')}<span>Главная страница сайта</span>${ic('arR',16)}</button><button data-act="reset">${ic('refresh')}<span>Сбросить демо-данные</span></button><button data-act="logout" class="m-danger">${ic('out')}<span>Выйти</span></button></div></div>`,'sheet-more')},
 mTour(){openModal(tourHtml().replace('class="pop tour"','class="tour m-tour"'),'sheet-tour')},
});
/* close sheets with the slide-down animation */

 let bar=$('#lpSticky');if(!bar){lp.insertAdjacentHTML('beforeend',`<div class="lp-sticky" id="lpSticky"><button class="btn btn-p btn-lg" data-go="auth-student">Начать бесплатно</button><button class="btn btn-s btn-lg" data-act="demoLogin" aria-label="Открыть демо">Демо</button></div>`);bar=$('#lpSticky')}
 const hero=$('#h3'),fin=$('.fin3');const f=()=>{if(!isM()){bar.classList.remove('on');return}const hb=hero?hero.getBoundingClientRect().bottom:0,ft=fin?fin.getBoundingClientRect().top:1e9;bar.classList.toggle('on',hb<60&&ft>innerHeight*.9)};
 window.addEventListener('scroll',f,{passive:true});L3.fns.push(['scroll',f]);f()};
